<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>jsonpickleJS Test</title>
</head>
<body>
   <h1>jsonpickleJS Test</h1>
    <p>See the browser console for output.</p>

    <script src="../build/jsonpickle.min.js"></script>
    <script>
        const tags = jsonpickle.tags;

        Thing = function(x) {
            this.x = x;
            this[tags.PY_CLASS] = '__main__.Thing';
            this.subThing = undefined;
            this.subList = [];
        }

        const firstThing = new Thing(5);
        const secondThing = new Thing('hello');

        firstThing.subList = [5, 'a', secondThing];
        secondThing.subThing = firstThing;
        firstThing.subThing = secondThing;
        firstThing.subThing2 = secondThing;

        const encodeOutput = jsonpickle.encode(firstThing);
        console.log('Encoded:', encodeOutput);

        const original = jsonpickle.decode(encodeOutput);
        console.log('Decoded:', original);
        // appears that there is a ref counting bug in the subList which
        // existed even in v.1.1 and before.
    </script>
</body>
</html>
