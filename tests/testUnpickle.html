<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>jsonpickleJS Decode Test</title>
</head>
<body>
<h1>jsonpickleJS Decode Test</h1>
<p>See the browser console for output.</p>

<script src="../build/jsonpickle.min.js"></script>
<script>
    Thing = function(x) {
        this.x = x;
    };

    Thing.prototype.square_x = function() {
        return this.x.map(x => x * x);
    };
    let json = '[[5, 6, 7], {"py/id": 1}, {"hi": 8, "bye": {"py/id": 1}}, {"py/object": "__main__.Thing", "x": {"py/id": 1}}]';
    let o = jsonpickle.decode(json);
    console.log('Decoded object #1:', o);
    console.log('Thing in o: ', o[3], o[3].x, o[3].square_x());

    json = '{"py/object": "fractions.Fraction", "_denominator": 3, "_numerator": 1}';
    let p = jsonpickle.decode(json);
    console.log('Decoded object #2:', p);
</script>
</body>
</html>
